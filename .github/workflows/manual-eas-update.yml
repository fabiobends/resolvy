name: Manual EAS Update

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: preview
      platform:
        description: Platform
        required: true
        type: choice
        options:
          - ios
          - android
          - all
        default: all

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Update
        run: eas update --channel ${{ github.event.inputs.profile }} --platform ${{ github.event.inputs.platform }} --non-interactive
