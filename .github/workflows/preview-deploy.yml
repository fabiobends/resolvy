name: Preview Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore last build deps
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .eas/last-build-deps.json
          key: eas-preview-last-build-deps-${{ github.run_id }}
          restore-keys: eas-preview-last-build-deps-

      - name: Check dependency changes
        id: deps
        run: |
          current=$(jq -S '.dependencies // {}' package.json)
          if [ -f .eas/last-build-deps.json ]; then
            old=$(cat .eas/last-build-deps.json)
            if [ "$old" = "$current" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build (Preview)
        if: steps.deps.outputs.changed == 'true'
        run: eas build --profile preview --platform all --non-interactive

      - name: EAS Update (Preview)
        if: steps.deps.outputs.changed == 'false'
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive

      - name: Save current deps
        if: steps.deps.outputs.changed == 'true'
        run: |
          mkdir -p .eas
          jq -S '.dependencies // {}' package.json > .eas/last-build-deps.json

      - name: Save cache
        if: steps.deps.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .eas/last-build-deps.json
          key: eas-preview-last-build-deps-${{ github.run_id }}
