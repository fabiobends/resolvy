name: Manual EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: preview
      platform:
        description: Platform
        required: true
        type: choice
        options:
          - ios
          - android
          - all
        default: all
      autoSubmit:
        description: Auto-submit to stores (production only)
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build
        run: |
          if [ "${{ github.event.inputs.profile }}" = "production" ] && [ "${{ github.event.inputs.autoSubmit }}" = "true" ]; then
            eas build --profile ${{ github.event.inputs.profile }} --platform ${{ github.event.inputs.platform }} --auto-submit --non-interactive
          else
            eas build --profile ${{ github.event.inputs.profile }} --platform ${{ github.event.inputs.platform }} --non-interactive
          fi
